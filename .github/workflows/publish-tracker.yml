name: Publish Pipeline Tracker

# Renders and deploys entirely on GitHub's runners — no laptop involved.
# Push a change to an intake note (Obsidian Git does this automatically) and the
# live site updates a minute or so later, whether or not the Mac is awake.

on:
  push:
    branches: [main]
    paths:
      - 'S0/Internal Builds/Pipeline Tracker/**'
      # The whole dir, not one named file: the renderer gained a markdown module,
      # and naming files individually meant a change to the new one would not
      # trigger a deploy. The site would go stale with nothing to show it.
      - '.tools/**'
      - '.github/workflows/publish-tracker.yml'
  workflow_dispatch: # manual re-publish button in the Actions tab

# GitHub Pages needs write access to Pages plus an OIDC token for deploy-pages;
# the renderer only ever reads the repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages # the dedicated group serialises Pages deploys across workflows
  # cancel-in-progress: false, unlike a plain build job. GitHub still cancels an
  # older *pending* run when a newer one queues, so a burst of pushes collapses
  # to one deploy from the newest state — but a deployment already in flight is
  # left to finish, because cancelling one mid-flight can leave Pages stuck.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # ships with Ruby; the renderer needs no gems
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Gate: never deploy a ranking whose arithmetic doesn't verify.
      - name: Verify the scoring model
        run: ruby '.tools/render-tracker.rb' --check

      - name: Render the site
        run: ruby '.tools/render-tracker.rb'

      - uses: actions/configure-pages@v5

      # Full-directory upload, so deleted or retracted asks disappear from the site.
      - name: Upload the rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tracker-site

      - name: Deploy to GitHub Pages
        id: deployment # the job's environment url reads page_url from this step
        uses: actions/deploy-pages@v4
